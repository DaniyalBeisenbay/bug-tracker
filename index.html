<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>🐞 Bug Tracker</h1>
    <button id="reportBugBtn">+ Report Bug</button>
  </header>

  <main class="container">

    <section class="stats">
      <div class="stat-card">
        <h2 id="totalBugs">0</h2>
        <p>Total Bugs</p>
      </div>

      <div class="stat-card">
        <h2 id="openBugs">0</h2>
        <p>Open</p>
      </div>

      <div class="stat-card">
        <h2 id="closedBugs">0</h2>
        <p>Closed</p>
      </div>
    </section>

    <section class="bugs-section">

  <div class="bugs-header">
     <h2>Reported Bugs</h2>

    <select id="filterStatus">
      <option value="All">All Bugs</option>
      <option value="Open">Open</option>
      <option value="In Progress">In Progress</option>
      <option value="Closed">Closed</option>
    </select>
  </div>

      <div id="bugList" class="bug-list">
        <p class="empty-message">No bugs reported yet.</p>
      </div>
    </section>

  </main>



<!-- REPORT BUG MODAL -->
<div class="modal" id="bugModal">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Report a Bug</h2>
      <button id="closeModalBtn">&times;</button>
    </div>

    <form id="bugForm">

      <label for="bugTitle">Title</label>
      <input
        type="text"
        id="bugTitle"
        placeholder="Example: Login button doesn't work"
        required
      >

      <label for="bugDescription">Description</label>
      <textarea
        id="bugDescription"
        placeholder="Describe the problem"
        required
      ></textarea>

      <label for="steps">Steps to Reproduce</label>
      <textarea
        id="steps"
        placeholder="1. Open the website&#10;2. Click Login&#10;3. Enter credentials"
        required
      ></textarea>

      <label for="expectedResult">Expected Result</label>
      <textarea
        id="expectedResult"
        placeholder="What should happen?"
        required
      ></textarea>

      <label for="actualResult">Actual Result</label>
      <textarea
        id="actualResult"
        placeholder="What actually happened?"
        required
      ></textarea>

      <div class="form-row">

        <div>
          <label for="severity">Severity</label>
          <select id="severity">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>

        <div>
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Closed">Closed</option>
          </select>
        </div>

      </div>

      <button type="submit" class="submit-btn">
        Create Bug
      </button>

    </form>

  </div>

</div>



  <script src="script.js"></script>
</body>
</html>
